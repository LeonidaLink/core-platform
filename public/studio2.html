<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leonida Studio</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0a0e14; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #fff; overflow: hidden; }
    #map { width: 100%; height: 100%; }

    .glass {
      background: rgba(8, 11, 18, 0.88);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    .panel {
      position: absolute;
      padding: 16px;
    }

    .panel-left { top: 16px; left: 16px; width: 280px; max-height: calc(100vh - 250px); overflow-y: auto; }
    .panel-right { top: 16px; right: 16px; width: 320px; max-height: calc(100vh - 32px); overflow-y: auto; }
    .panel-bottom-left { bottom: 16px; left: 16px; width: 260px; }

    .logo { height: 32px; margin-bottom: 12px; }
    .title { font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }

    .model-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .model-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 10px 6px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      color: #fff;
    }
    .model-btn:hover { background: rgba(255,255,255,0.1); border-color: #7969EE; }
    .model-btn.active { background: rgba(121,105,238,0.25); border-color: #7969EE; }
    .model-btn .icon { font-size: 16px; }
    .model-btn .label { font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.7); text-align: center; line-height: 1.2; }

    .form-group { margin-bottom: 12px; }
    .form-label { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: block; }
    .form-input { width: 100%; padding: 10px 12px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; font-size: 13px; outline: none; transition: border-color 0.2s; }
    .form-input:focus { border-color: #7969EE; }
    .form-input:disabled { opacity: 0.4; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

    .btn { padding: 10px 16px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s; border: none; }
    .btn-primary { background: #7969EE; color: #fff; }
    .btn-primary:hover { background: #6a5ad4; }
    .btn-publish { background: #10b981; color: #fff; }
    .btn-publish:hover { background: #0d9668; }
    .btn-publish:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-danger { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.1); }
    .btn-danger:hover { background: #dc2626; color: #fff; border-color: #dc2626; }
    .btn-full { width: 100%; }

    .divider { height: 1px; background: rgba(255,255,255,0.1); margin: 16px 0; }

    .status-line { font-size: 11px; color: rgba(255,255,255,0.4); margin-bottom: 12px; }

    .shape-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .shape-item:hover { background: rgba(255,255,255,0.08); }
    .shape-item.selected { background: rgba(121,105,238,0.2); border: 1px solid #7969EE; }
    .shape-color { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .shape-info { flex: 1; min-width: 0; }
    .shape-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .shape-type { font-size: 11px; color: rgba(255,255,255,0.4); }
    .shape-actions { display: flex; gap: 4px; }
    .shape-action { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: transparent; border: none; color: rgba(255,255,255,0.4); cursor: pointer; font-size: 12px; }
    .shape-action:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .shape-action.locked { color: #fbbf24; }

    .mode-indicator {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      z-index: 100;
    }
    .mode-place { background: #7969EE; }
    .mode-move { background: #10b981; }
    .mode-select { background: rgba(8, 11, 18, 0.85); border: 1px solid rgba(255,255,255,0.2); }

    .coords-display {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 12px;
      background: rgba(0,0,0,0.6);
      border-radius: 6px;
      font-size: 11px;
      font-family: monospace;
      color: rgba(255,255,255,0.6);
    }

    input[type="range"] { -webkit-appearance: none; width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; cursor: pointer; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #7969EE; border-radius: 50%; }

    .back-link {
      position: absolute;
      bottom: 16px;
      right: 16px;
      padding: 10px 16px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      transition: all 0.2s;
      z-index: 100;
    }
    .back-link:hover { background: #7969EE; border-color: #7969EE; }

    /* Gizmo */
    #gizmo { position: absolute; inset: 0; pointer-events: none; z-index: 50; display: none; }
    .handle { position: absolute; top: 0; left: 0; pointer-events: auto; }
    .handle-resize { width: 12px; height: 12px; margin: -6px 0 0 -6px; background: #fff; border: 2px solid #7969EE; border-radius: 2px; cursor: pointer; }
    .handle-move { width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.4); }
    .handle-rotate { background: #7969EE; cursor: grab; }
    .handle-height { background: #38bdf8; cursor: ns-resize; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="gizmo">
    <div class="handle handle-resize" id="h-resize-right"></div>
    <div class="handle handle-resize" id="h-resize-left"></div>
    <div class="handle handle-resize" id="h-resize-top"></div>
    <div class="handle handle-resize" id="h-resize-bottom"></div>
    <div class="handle handle-move handle-rotate" id="h-rotate" title="Rotate"></div>
    <div class="handle handle-move handle-height" id="h-height" title="Height"></div>
  </div>

  <!-- Mode Indicator -->
  <div id="mode-indicator" class="mode-indicator mode-select">Select Mode</div>

  <!-- Coords Display -->
  <div id="coords" class="coords-display">X: 0.000 Y: 0.000</div>

  <!-- Back to Map -->
  <a href="/map" class="back-link">← Back to Map</a>

  <!-- Left Panel - Tools & Properties -->
  <div class="panel glass panel-left">
    <img src="/brand/logo.png" class="logo" alt="Leonida">

    <div class="title">Buildings</div>
    <div class="model-grid" id="model-grid"></div>

    <div class="divider"></div>

    <div class="title">Properties</div>
    <div class="form-group">
      <label class="form-label">Name</label>
      <input type="text" class="form-input" id="prop-name" placeholder="Building name">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Width (m)</label>
        <input type="number" class="form-input" id="prop-width" value="12" min="1">
      </div>
      <div class="form-group">
        <label class="form-label">Depth (m)</label>
        <input type="number" class="form-input" id="prop-depth" value="10" min="1">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Height (m)</label>
        <input type="number" class="form-input" id="prop-height" value="6" min="1">
      </div>
      <div class="form-group">
        <label class="form-label">Rotation (°)</label>
        <input type="number" class="form-input" id="prop-rotation" value="0" min="0" max="360">
      </div>
    </div>

    <div class="divider"></div>

    <button class="btn btn-primary btn-full" id="place-btn">Place Building</button>
    <div style="height: 8px"></div>
    <button class="btn btn-danger btn-full" id="delete-btn">Delete Selected</button>

    <div class="divider"></div>

    <div class="title">Infrastructure</div>
    <button class="btn btn-full" id="place-road-btn" style="background: rgba(255,255,255,0.1); color: #fff;">Place Road</button>
    <div style="height: 8px"></div>
    <button class="btn btn-full" id="place-bridge-btn" style="background: rgba(255,255,255,0.1); color: #fff;">Place Bridge</button>

    <div class="divider"></div>

    <button class="btn btn-full" id="3d-btn" style="background: rgba(255,255,255,0.1); color: #fff;">3D View (Pitch 60°)</button>
    <button class="btn btn-full" id="top-btn" style="background: rgba(255,255,255,0.1); color: #fff; margin-top: 8px;">Top View (Pitch 0°)</button>
  </div>

  <!-- Bottom Left - Base map controls (fixed height, panel-left is capped above so it can't reach this) -->
  <div class="panel glass panel-bottom-left">
    <div class="title">Base Map</div>
    <div class="form-group">
      <label class="form-label">Opacity</label>
      <input type="range" id="raster-opacity" min="0" max="100" value="100">
    </div>
    <div class="form-group">
      <label class="form-label" id="height-exag-label">Height Exaggeration (8x)</label>
      <input type="range" id="height-exag" min="1" max="30" value="8">
    </div>
    <div class="form-group">
      <label class="form-label">Reference Overlay</label>
      <input type="range" id="real-map-opacity" min="0" max="100" value="60">
    </div>
  </div>

  <!-- Right Panel - Shapes -->
  <div class="panel glass panel-right">
    <div class="title">Objects (<span id="shape-count">0</span>)</div>
    <div class="status-line" id="status-line">Not saved yet</div>
    <div id="shape-list"></div>

    <div class="divider"></div>

    <button class="btn btn-publish btn-full" id="publish-btn">Publish to Map</button>
    <div style="height: 8px"></div>
    <button class="btn btn-full" id="copy-btn" style="background: rgba(255,255,255,0.1); color: #fff;">Copy GeoJSON</button>
    <div style="height: 8px"></div>
    <button class="btn btn-full" id="download-btn" style="background: rgba(255,255,255,0.1); color: #fff;">Download .geojson</button>
    <div style="height: 8px"></div>
    <button class="btn btn-danger btn-full" id="clear-btn">Delete All</button>
  </div>

  <script>
    // ===== CONFIG (mirrors app/map/lib/leonida-crs.ts) =====
    const STORAGE_KEY = 'leonida-studio-shapes';
    const MAP_WIDTH_PX = 2590;
    const MAP_HEIGHT_PX = 3240;
    const BOUNDS = { west: 0, south: 0, east: 1.0, north: 1.251004 };
    let HEIGHT_EXAGGERATION = 8;
    // Apple Maps-style buildings: one muted blue-gray for every building
    // (roads/bridges keep their own asphalt/deck color), shaded by the map's
    // light so each face reads with soft depth instead of flat color.
    const APPLE_BUILDING_COLOR = '#8791A6';

    const SUPABASE_URL = 'https://cggrcifabwvbvlpnlrpd.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNnZ3JjaWZhYnd2YnZscG5scnBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NTcwNjgsImV4cCI6MjA5OTUzMzA2OH0.zJFl6ZufA4sxBbZwDtrOx7ogNeQO-kIXjLgmplpEeFM';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const MODEL_PRESETS = [
      { id: 'house',      name: 'House',          color: '#D4A574', width: 12, depth: 10, height: 6 },
      { id: 'shop',       name: 'Shop',            color: '#34D399', width: 20, depth: 15, height: 8 },
      { id: 'apartment',  name: 'Apartment',       color: '#F472B6', width: 35, depth: 25, height: 25 },
      { id: 'office',     name: 'Office Block',    color: '#0DB9FF', width: 50, depth: 40, height: 60 },
      { id: 'tower',      name: 'Tower',           color: '#FF69B4', width: 40, depth: 40, height: 120 },
      { id: 'skyscraper', name: 'Skyscraper',      color: '#7969EE', width: 45, depth: 45, height: 220 },
      { id: 'hotel',      name: 'Hotel',           color: '#FBBF24', width: 60, depth: 30, height: 90 },
      { id: 'warehouse',  name: 'Warehouse',       color: '#9CA3AF', width: 80, depth: 50, height: 12 },
      { id: 'parking',    name: 'Parking Garage',  color: '#6B7280', width: 60, depth: 40, height: 20 },
    ];

    // ===== STATE =====
    let shapes = [];
    let selectedId = null;
    let activeModel = MODEL_PRESETS[0];
    let isDragging = false;
    let dragStart = null;
    let isPlacingRoad = null; // null | 'road' | 'bridge'
    let roadStartPoint = null; // [lng,lat] set after the first click

    // ===== UNDO =====
    let undoStack = [];
    function pushUndo() {
      undoStack.push(JSON.stringify(shapes));
      if (undoStack.length > 50) undoStack.shift();
    }
    function undo() {
      if (undoStack.length === 0) return;
      shapes = JSON.parse(undoStack.pop());
      selectedId = null;
      isDragging = false;
      dragStart = null;
      renderShapes();
      saveToStorage();
      updateShapeList();
      updatePropertiesPanel();
      updateModeIndicator();
    }

    // ===== MAP =====
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {},
        layers: [{ id: 'bg', type: 'background', paint: { 'background-color': '#0a0e14' } }],
        light: { anchor: 'viewport', color: '#dbe4f0', intensity: 0.45, position: [1.15, 210, 55] }
      },
      center: [0.5, 0.625],
      zoom: 12,
      pitch: 0,
      renderWorldCopies: false,
      maxPitch: 75
    });

    map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

    map.on('error', e => console.error('[ERROR]', e));

    map.on('load', () => {
      map.addSource('base-map', {
        type: 'image',
        url: '/map/leonida-base.jpg',
        coordinates: [
          [BOUNDS.west, BOUNDS.north],
          [BOUNDS.east, BOUNDS.north],
          [BOUNDS.east, BOUNDS.south],
          [BOUNDS.west, BOUNDS.south],
        ]
      });
      map.addLayer({
        id: 'base-map-layer',
        type: 'raster',
        source: 'base-map',
        paint: { 'raster-opacity': 1 }
      }); // no beforeId: appended above 'bg', which is what we want

      // Reference overlay laid over the stylized base map so buildings can
      // be traced against real street/block layout instead of guessed from
      // a description. cleanbase.png has a different aspect ratio and crop
      // margin than BOUNDS (leonida-base.jpg's exact pixel dimensions), so
      // its corners are NOT plain BOUNDS — they're computed by matching the
      // island's silhouette bounding box in both images (color-detected:
      // water vs. land) and mapping cleanbase's full canvas through that
      // same fractional offset into leonida-base.jpg's pixel space, then to
      // lng/lat. See scratchpad find-alignment2.js for the detection script.
      // Nudged +73m east (0.028185deg at MAP_WIDTH_PX=2590) and -11m south
      // (0.003395deg at MAP_HEIGHT_PX=3240) per manual road-alignment check
      // against the base map.
      map.addSource('real-map', {
        type: 'image',
        url: '/map/cleanbase.png',
        coordinates: [
          [0.067993, 1.241435], // top-left
          [0.931465, 1.241435], // top-right
          [0.931465, -0.006330], // bottom-right
          [0.067993, -0.006330], // bottom-left
        ]
      });
      map.addLayer({
        id: 'real-map-layer',
        type: 'raster',
        source: 'real-map',
        paint: { 'raster-opacity': 0.6 }
      }); // appended above base-map-layer, below shapes — trace target, not a floor

      map.fitBounds([[BOUNDS.west, BOUNDS.south], [BOUNDS.east, BOUNDS.north]], { padding: 20 });

      loadFromStorage();
      renderShapes();
      updateModeIndicator();
      updateShapeList();
      loadPublishedFromSupabase();
    });

    map.on('move', updateGizmo);

    // ===== HELPERS (meters -> degrees, matches leonida-crs.ts) =====
    function mToLng(m) { return m / MAP_WIDTH_PX; }
    function mToLat(m) { return m / MAP_HEIGHT_PX; }

    function boxPoint(center, rotationDeg, localXMeters, localYMeters) {
      const x = mToLng(localXMeters);
      const y = mToLat(localYMeters);
      const rad = (rotationDeg * Math.PI) / 180;
      const cos = Math.cos(rad), sin = Math.sin(rad);
      return [center[0] + x * cos - y * sin, center[1] + x * sin + y * cos];
    }

    function toLocalDelta(dx, dy, rotationDeg) {
      const rad = (rotationDeg * Math.PI) / 180;
      const cos = Math.cos(rad), sin = Math.sin(rad);
      return [dx * cos + dy * sin, -dx * sin + dy * cos];
    }

    // Rounded-rectangle footprint (Apple Maps-style soft building corners),
    // no 3D model / dependency involved — just more points on the same
    // fill-extrusion polygon. Corner arcs are built directly in the same
    // (anisotropic) lng/lat half-extent space as the old sharp-corner boxes,
    // and rotated the exact same way (plain cos/sin on that space) — doing
    // the rotation in isotropic meter-space first and converting per-axis
    // afterward looks correct at rotation 0 but shears at any other angle,
    // since scale and rotate don't commute when the two axes scale
    // differently (MAP_WIDTH_PX vs MAP_HEIGHT_PX).
    const BUILDING_CORNER_SEGMENTS = 6;
    function generateRoundedBox(cx, cy, width, depth, rotation) {
      const hw = mToLng(width) / 2;
      const hd = mToLat(depth) / 2;
      const rM = Math.min(width, depth) * 0.22;
      const rx = Math.min(mToLng(rM), mToLng(6), hw);
      const ry = Math.min(mToLat(rM), mToLat(6), hd);
      const rad = (rotation * Math.PI) / 180;
      const cos = Math.cos(rad);
      const sin = Math.sin(rad);
      const corners = [
        { cx: hw - rx, cy: hd - ry, a0: 0, a1: Math.PI / 2 },
        { cx: -(hw - rx), cy: hd - ry, a0: Math.PI / 2, a1: Math.PI },
        { cx: -(hw - rx), cy: -(hd - ry), a0: Math.PI, a1: 1.5 * Math.PI },
        { cx: hw - rx, cy: -(hd - ry), a0: 1.5 * Math.PI, a1: 2 * Math.PI },
      ];
      const points = [];
      corners.forEach(({ cx: ccx, cy: ccy, a0, a1 }) => {
        for (let s = 0; s <= BUILDING_CORNER_SEGMENTS; s++) {
          const t = a0 + (a1 - a0) * (s / BUILDING_CORNER_SEGMENTS);
          points.push([ccx + rx * Math.cos(t), ccy + ry * Math.sin(t)]);
        }
      });
      return points.map(([x, y]) => [
        cx + x * cos - y * sin,
        cy + x * sin + y * cos,
      ]);
    }

    function isLineShape(shape) { return shape.type === 'road' || shape.type === 'bridge'; }

    // Buffers a straight segment into a rectangle strip of the given width.
    // Direction is computed in meter-space (not raw degrees) since lng/lat use
    // different meters-per-degree divisors in this fictional CRS.
    function bufferLineToPolygon(points, widthM) {
      const [p0, p1] = points;
      const dxM = (p1[0] - p0[0]) * MAP_WIDTH_PX;
      const dyM = (p1[1] - p0[1]) * MAP_HEIGHT_PX;
      const len = Math.hypot(dxM, dyM) || 1;
      const nxM = -dyM / len, nyM = dxM / len; // unit normal, meter-space
      const hw = widthM / 2;
      const offLng = (nxM * hw) / MAP_WIDTH_PX;
      const offLat = (nyM * hw) / MAP_HEIGHT_PX;
      return [
        [p0[0] + offLng, p0[1] + offLat],
        [p1[0] + offLng, p1[1] + offLat],
        [p1[0] - offLng, p1[1] - offLat],
        [p0[0] - offLng, p0[1] - offLat],
      ];
    }

    function boxFeature(shape, width, depth, base, height, color) {
      const coords = generateRoundedBox(shape.x, shape.y, width, depth, shape.rotation);
      return {
        type: 'Feature',
        id: shape.id,
        geometry: { type: 'Polygon', coordinates: [[...coords, coords[0]]] },
        properties: { id: shape.id, name: shape.name, type: shape.type, color, base, height, locked: shape.locked }
      };
    }

    // Buildings taller than this get a stepped/setback silhouette (a narrower
    // upper tier on top of the full-footprint base) instead of a plain prism —
    // mirrors the tiered towers in reference Apple/Google Maps 3D renders.
    const TALL_BUILDING_HEIGHT_M = 60;
    const TIER_HEIGHT_RATIO = 0.62; // base tier reaches this fraction of total height
    const TIER_FOOTPRINT_RATIO = 0.62; // upper tier's width/depth vs the base

    function buildingFeatures(shape) {
      if (shape.height < TALL_BUILDING_HEIGHT_M) {
        return [boxFeature(shape, shape.width, shape.depth, 0, shape.height, shape.color)];
      }
      const baseTierHeight = shape.height * TIER_HEIGHT_RATIO;
      return [
        boxFeature(shape, shape.width, shape.depth, 0, baseTierHeight, shape.color),
        boxFeature(shape, shape.width * TIER_FOOTPRINT_RATIO, shape.depth * TIER_FOOTPRINT_RATIO, baseTierHeight, shape.height, shape.color),
      ];
    }

    // A shape can expand into multiple stacked GeoJSON features while
    // remaining one logical entity — all features share the same
    // `id`/`properties.id` so selection, dragging, and deletion still
    // operate on the whole shape.
    function shapeToFeatures(shape) {
      if (isLineShape(shape)) {
        const coords = bufferLineToPolygon(shape.points, shape.widthM);
        return [{
          type: 'Feature',
          id: shape.id,
          geometry: { type: 'Polygon', coordinates: [[...coords, coords[0]]] },
          properties: { id: shape.id, name: shape.name, type: shape.type, color: shape.color, base: 0, height: shape.heightM, locked: shape.locked }
        }];
      }
      return buildingFeatures(shape);
    }

    // ===== STORAGE =====
    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(shapes));
        document.getElementById('status-line').textContent = 'Saved ' + new Date().toLocaleTimeString();
      } catch (e) { console.error('[Storage error]', e); }
    }

    function loadFromStorage() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) shapes = JSON.parse(saved);
      } catch (e) { console.error('[Storage error]', e); }
    }

    // ===== SUPABASE =====
    function rowToShape(row) {
      if (row.type === 'road' || row.type === 'bridge') {
        return {
          id: row.id,
          name: row.name || row.type,
          type: row.type,
          color: row.color || '#3a3a3a',
          points: row.points || [[row.center_lng, row.center_lat], [row.center_lng, row.center_lat]],
          widthM: row.width_m,
          heightM: row.height_m,
          locked: !!row.locked,
        };
      }
      return {
        id: row.id,
        name: row.name || row.type,
        type: row.type,
        color: row.color || '#D4A574',
        x: row.center_lng,
        y: row.center_lat,
        width: row.width_m,
        depth: row.depth_m,
        height: row.height_m,
        rotation: row.rotation || 0,
        locked: !!row.locked,
      };
    }

    function shapeToRow(s) {
      if (isLineShape(s)) {
        const mid = [(s.points[0][0] + s.points[1][0]) / 2, (s.points[0][1] + s.points[1][1]) / 2];
        return {
          id: s.id,
          name: s.name,
          type: s.type,
          center_lng: mid[0],
          center_lat: mid[1],
          width_m: s.widthM,
          depth_m: null,
          height_m: s.heightM,
          rotation: 0,
          color: s.color,
          locked: s.locked,
          published: true,
          points: s.points,
        };
      }
      return {
        id: s.id,
        name: s.name,
        type: s.type,
        center_lng: s.x,
        center_lat: s.y,
        width_m: s.width,
        depth_m: s.depth,
        height_m: s.height,
        rotation: s.rotation,
        color: s.color,
        locked: s.locked,
        published: true,
        points: null,
      };
    }

    async function loadPublishedFromSupabase() {
      const { data, error } = await supabaseClient.from('map_shapes').select('*').eq('published', true);
      if (error) { console.error('[SUPABASE LOAD]', error); return; }
      const existingIds = new Set(shapes.map(s => s.id));
      let added = false;
      (data || []).forEach(row => {
        if (!existingIds.has(row.id)) {
          shapes.push(rowToShape(row));
          added = true;
        }
      });
      if (added) { renderShapes(); updateShapeList(); }
    }

    async function publishToMap() {
      const btn = document.getElementById('publish-btn');
      if (shapes.length === 0) return;
      btn.disabled = true;
      btn.textContent = 'Publishing…';
      const rows = shapes.map(shapeToRow);
      const { error } = await supabaseClient.from('map_shapes').upsert(rows);
      btn.disabled = false;
      if (error) {
        console.error('[SUPABASE PUBLISH]', error);
        btn.textContent = 'Publish failed';
        setTimeout(() => { btn.textContent = 'Publish to Map'; }, 2500);
        return;
      }
      btn.textContent = 'Published!';
      setTimeout(() => { btn.textContent = 'Publish to Map'; }, 2000);
    }

    document.getElementById('publish-btn').onclick = publishToMap;

    // ===== RENDER =====
    function renderShapes() {
      ['shapes-fill', 'shapes-line'].forEach(id => {
        if (map.getLayer(id)) map.removeLayer(id);
      });
      if (map.getSource('shapes-source')) map.removeSource('shapes-source');

      if (shapes.length === 0) { updateGizmo(); return; }

      const fc = { type: 'FeatureCollection', features: shapes.flatMap(shapeToFeatures) };

      map.addSource('shapes-source', { type: 'geojson', data: fc });

      map.addLayer({
        id: 'shapes-fill',
        type: 'fill-extrusion',
        source: 'shapes-source',
        minzoom: 0,
        paint: {
          'fill-extrusion-color': [
            'case',
            ['==', ['get', 'id'], selectedId || ''],
            '#ffffff',
            ['any', ['==', ['get', 'type'], 'road'], ['==', ['get', 'type'], 'bridge']],
            ['get', 'color'],
            APPLE_BUILDING_COLOR
          ],
          'fill-extrusion-height': ['*', ['get', 'height'], HEIGHT_EXAGGERATION],
          'fill-extrusion-base': ['*', ['get', 'base'], HEIGHT_EXAGGERATION],
          'fill-extrusion-vertical-gradient': true,
          'fill-extrusion-opacity': 0.95
        }
      }); // no beforeId: appended above base-map-layer, which is what we want

      map.addLayer({
        id: 'shapes-line',
        type: 'line',
        source: 'shapes-source',
        minzoom: 0,
        filter: ['==', ['get', 'id'], selectedId || ''],
        paint: { 'line-color': '#ffffff', 'line-width': 3, 'line-opacity': 1 }
      });

      updateGizmo();
    }

    document.getElementById('height-exag').oninput = (e) => {
      HEIGHT_EXAGGERATION = Number(e.target.value);
      document.getElementById('height-exag-label').textContent = `Height Exaggeration (${HEIGHT_EXAGGERATION}x)`;
      if (map.getLayer('shapes-fill')) {
        map.setPaintProperty('shapes-fill', 'fill-extrusion-height', ['*', ['get', 'height'], HEIGHT_EXAGGERATION]);
      }
    };

    document.getElementById('raster-opacity').oninput = (e) => {
      if (map.getLayer('base-map-layer')) {
        map.setPaintProperty('base-map-layer', 'raster-opacity', Number(e.target.value) / 100);
      }
    };

    document.getElementById('real-map-opacity').oninput = (e) => {
      if (map.getLayer('real-map-layer')) {
        map.setPaintProperty('real-map-layer', 'raster-opacity', Number(e.target.value) / 100);
      }
    };

    // ===== MODEL GRID =====
    const modelGrid = document.getElementById('model-grid');
    MODEL_PRESETS.forEach(model => {
      const btn = document.createElement('button');
      btn.className = 'model-btn' + (model.id === activeModel.id ? ' active' : '');
      btn.innerHTML = `
        <span class="icon" style="color: ${model.color}">■</span>
        <span class="label">${model.name}</span>
      `;
      btn.onclick = () => {
        document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeModel = model;
        document.getElementById('prop-width').value = model.width;
        document.getElementById('prop-depth').value = model.depth;
        document.getElementById('prop-height').value = model.height;
        document.getElementById('prop-name').value = '';
      };
      modelGrid.appendChild(btn);
    });

    // ===== PROPERTIES (edit selected) =====
    // Width/Height stay meaningful for roads & bridges (road width, bridge
    // elevation) and are repurposed for them; Depth/Rotation are box-only.
    ['prop-width', 'prop-depth', 'prop-height', 'prop-rotation'].forEach(id => {
      document.getElementById(id).oninput = () => {
        if (!selectedId) return;
        const shape = shapes.find(s => s.id === selectedId);
        if (!shape || shape.locked) return;

        if (isLineShape(shape)) {
          if (id === 'prop-width') {
            const v = parseFloat(document.getElementById('prop-width').value) || shape.widthM;
            shapes = shapes.map(s => s.id === selectedId ? { ...s, widthM: v } : s);
          } else if (id === 'prop-height') {
            const v = parseFloat(document.getElementById('prop-height').value) || shape.heightM;
            shapes = shapes.map(s => s.id === selectedId ? { ...s, heightM: v } : s);
          } else {
            return;
          }
        } else {
          shapes = shapes.map(s => s.id === selectedId ? {
            ...s,
            width: parseFloat(document.getElementById('prop-width').value) || s.width,
            depth: parseFloat(document.getElementById('prop-depth').value) || s.depth,
            height: parseFloat(document.getElementById('prop-height').value) || s.height,
            rotation: parseFloat(document.getElementById('prop-rotation').value) || 0
          } : s);
        }
        renderShapes();
        saveToStorage();
        updateShapeList();
      };
    });

    // ===== PLACE =====
    let isPlaceMode = false;
    document.getElementById('place-btn').onclick = () => {
      cancelRoadPlacement();
      isPlaceMode = !isPlaceMode;
      document.getElementById('place-btn').textContent = isPlaceMode ? 'Cancel' : 'Place Building';
      document.getElementById('place-btn').className = isPlaceMode ? 'btn btn-danger btn-full' : 'btn btn-primary btn-full';
      updateModeIndicator();
    };

    // ===== ROADS / BRIDGES =====
    function updateRoadButtons() {
      const roadBtn = document.getElementById('place-road-btn');
      const bridgeBtn = document.getElementById('place-bridge-btn');
      roadBtn.textContent = isPlacingRoad === 'road' ? (roadStartPoint ? 'Click end point…' : 'Cancel') : 'Place Road';
      roadBtn.className = isPlacingRoad === 'road' ? 'btn btn-danger btn-full' : 'btn btn-full';
      if (isPlacingRoad !== 'road') roadBtn.style.background = 'rgba(255,255,255,0.1)';
      bridgeBtn.textContent = isPlacingRoad === 'bridge' ? (roadStartPoint ? 'Click end point…' : 'Cancel') : 'Place Bridge';
      bridgeBtn.className = isPlacingRoad === 'bridge' ? 'btn btn-danger btn-full' : 'btn btn-full';
      if (isPlacingRoad !== 'bridge') bridgeBtn.style.background = 'rgba(255,255,255,0.1)';
    }

    function cancelRoadPlacement() {
      isPlacingRoad = null;
      roadStartPoint = null;
      clearRoadPreview();
      updateRoadButtons();
    }

    function togglePlacingRoad(kind) {
      if (isPlacingRoad === kind) {
        cancelRoadPlacement();
        return;
      }
      isPlaceMode = false;
      document.getElementById('place-btn').textContent = 'Place Building';
      document.getElementById('place-btn').className = 'btn btn-primary btn-full';
      isPlacingRoad = kind;
      roadStartPoint = null;
      updateRoadButtons();
      updateModeIndicator();
      updateGizmo();
    }

    document.getElementById('place-road-btn').onclick = () => togglePlacingRoad('road');
    document.getElementById('place-bridge-btn').onclick = () => togglePlacingRoad('bridge');

    function clearRoadPreview() {
      if (map.getLayer('road-preview-line')) map.removeLayer('road-preview-line');
      if (map.getSource('road-preview-source')) map.removeSource('road-preview-source');
    }

    function updateRoadPreview(from, to) {
      const data = { type: 'Feature', geometry: { type: 'LineString', coordinates: [from, to] }, properties: {} };
      const src = map.getSource('road-preview-source');
      if (src) { src.setData(data); return; }
      map.addSource('road-preview-source', { type: 'geojson', data });
      map.addLayer({
        id: 'road-preview-line',
        type: 'line',
        source: 'road-preview-source',
        paint: { 'line-color': '#ffffff', 'line-width': 2, 'line-dasharray': [2, 2] },
      });
    }

    // ===== PLACE + SELECT (single handler — two separate listeners on the
    // same click raced: the select listener would query the fill layer just
    // added by the place listener before the GPU had rendered a frame with
    // it, find nothing, and immediately deselect the shape just placed) =====
    map.on('click', e => {
      if (isPlacingRoad) {
        const pt = [e.lngLat.lng, e.lngLat.lat];
        if (!roadStartPoint) {
          roadStartPoint = pt;
          updateRoadButtons();
          updateModeIndicator();
        } else {
          const isBridge = isPlacingRoad === 'bridge';
          const newShape = {
            id: crypto.randomUUID(),
            name: `${isBridge ? 'Bridge' : 'Road'} ${Date.now() % 10000}`,
            type: isPlacingRoad,
            color: isBridge ? '#B8B8B8' : '#3a3a3a',
            points: [roadStartPoint, pt],
            widthM: isBridge ? 10 : 8,
            heightM: isBridge ? 4 : 0,
            locked: false,
          };
          pushUndo();
          shapes.push(newShape);
          selectedId = newShape.id;
          cancelRoadPlacement();
          renderShapes();
          saveToStorage();
          updateShapeList();
          updatePropertiesPanel();
          updateModeIndicator();
        }
        return;
      }

      if (isPlaceMode) {
        const lng = e.lngLat.lng;
        const lat = e.lngLat.lat;
        if (lng < BOUNDS.west || lng > BOUNDS.east || lat < BOUNDS.south || lat > BOUNDS.north) {
          alert('Click inside the map bounds!');
          return;
        }

        const newShape = {
          id: crypto.randomUUID(),
          name: document.getElementById('prop-name').value || `${activeModel.name} ${Date.now() % 10000}`,
          type: activeModel.id,
          color: activeModel.color,
          x: lng,
          y: lat,
          width: parseFloat(document.getElementById('prop-width').value) || activeModel.width,
          depth: parseFloat(document.getElementById('prop-depth').value) || activeModel.depth,
          height: parseFloat(document.getElementById('prop-height').value) || activeModel.height,
          rotation: parseFloat(document.getElementById('prop-rotation').value) || 0,
          locked: false
        };
        pushUndo();
        shapes.push(newShape);
        selectedId = newShape.id;
        renderShapes();
        saveToStorage();
        updateShapeList();
        updatePropertiesPanel();
        isPlaceMode = false;
        document.getElementById('place-btn').textContent = 'Place Building';
        document.getElementById('place-btn').className = 'btn btn-primary btn-full';
        updateModeIndicator();
        map.flyTo({ pitch: 0, duration: 300 });
        return;
      }

      if (!map.getLayer('shapes-fill')) return;
      const features = map.queryRenderedFeatures(e.point, { layers: ['shapes-fill'] });
      if (features.length > 0) {
        const id = features[0].properties.id;
        if (id !== selectedId) {
          selectedId = id;
          renderShapes();
          updateShapeList();
          updatePropertiesPanel();
          updateModeIndicator();
        }
      } else {
        if (selectedId) {
          selectedId = null;
          renderShapes();
          updateShapeList();
          updateModeIndicator();
        }
      }
    });

    // ===== DRAG TO MOVE (whole body, top-down only, buildings only —
    // roads/bridges don't have a single x/y; delete and redraw instead) =====
    map.on('mousedown', e => {
      if (map.getPitch() > 5 || isPlaceMode || isPlacingRoad) return;
      if (!map.getLayer('shapes-fill')) return;
      const features = map.queryRenderedFeatures(e.point, { layers: ['shapes-fill'] });
      if (features.length > 0) {
        const shape = shapes.find(s => s.id === features[0].properties.id);
        if (shape && !shape.locked && !isLineShape(shape)) {
          pushUndo();
          isDragging = true;
          dragStart = { x: e.lngLat.lng, y: e.lngLat.lat, shapeX: shape.x, shapeY: shape.y, shapeId: shape.id };
          map.dragPan.disable();
          updateModeIndicator();
        }
      }
    });

    map.on('mousemove', e => {
      if (!isDragging || !dragStart) return;
      const dx = e.lngLat.lng - dragStart.x;
      const dy = e.lngLat.lat - dragStart.y;
      shapes = shapes.map(s => s.id === dragStart.shapeId ? { ...s, x: dragStart.shapeX + dx, y: dragStart.shapeY + dy } : s);
      renderShapes();
    });

    map.on('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        dragStart = null;
        map.dragPan.enable();
        saveToStorage();
        updateShapeList();
        updateModeIndicator();
      }
    });

    // ===== KEYBOARD =====
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;

      // Undo: Cmd/Ctrl+Z (standard) and Alt+Z (as requested)
      if ((e.key === 'z' || e.key === 'Z') && (e.metaKey || e.ctrlKey || e.altKey)) {
        e.preventDefault();
        undo();
        return;
      }

      if (e.key === 'Escape') {
        selectedId = null;
        isPlaceMode = false;
        document.getElementById('place-btn').textContent = 'Place Building';
        document.getElementById('place-btn').className = 'btn btn-primary btn-full';
        cancelRoadPlacement();
        renderShapes();
        updateShapeList();
        updateModeIndicator();
      }

      if ((e.key === 'Delete' || e.key === 'Backspace') && selectedId) {
        const shape = shapes.find(s => s.id === selectedId);
        if (shape && !shape.locked) {
          shapes = shapes.filter(s => s.id !== selectedId);
          selectedId = null;
          renderShapes();
          saveToStorage();
          updateShapeList();
        }
      }

      if (selectedId && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        const shape = shapes.find(s => s.id === selectedId);
        if (shape && !shape.locked) {
          const step = e.shiftKey ? 10 : 1;
          let dx = 0, dy = 0;
          if (e.key === 'ArrowLeft') dx = -mToLng(step);
          if (e.key === 'ArrowRight') dx = mToLng(step);
          if (e.key === 'ArrowUp') dy = mToLat(step);
          if (e.key === 'ArrowDown') dy = -mToLat(step);
          shapes = shapes.map(s => {
            if (s.id !== selectedId) return s;
            if (isLineShape(s)) return { ...s, points: s.points.map(p => [p[0] + dx, p[1] + dy]) };
            return { ...s, x: s.x + dx, y: s.y + dy };
          });
          renderShapes();
          saveToStorage();
          updateShapeList();
        }
      }
    });

    // ===== COORDS =====
    map.on('mousemove', e => {
      document.getElementById('coords').textContent = `X: ${e.lngLat.lng.toFixed(4)} Y: ${e.lngLat.lat.toFixed(4)}`;
      if (isPlacingRoad && roadStartPoint) {
        updateRoadPreview(roadStartPoint, [e.lngLat.lng, e.lngLat.lat]);
      }
    });

    // ===== VIEW CONTROLS =====
    document.getElementById('3d-btn').onclick = () => map.flyTo({ pitch: 60, zoom: 14, duration: 1000 });
    document.getElementById('top-btn').onclick = () => map.flyTo({ pitch: 0, zoom: 14, duration: 500 });

    // ===== DELETE =====
    document.getElementById('delete-btn').onclick = () => {
      if (selectedId) {
        const shape = shapes.find(s => s.id === selectedId);
        if (shape && !shape.locked) {
          shapes = shapes.filter(s => s.id !== selectedId);
          selectedId = null;
          renderShapes();
          saveToStorage();
          updateShapeList();
        }
      }
    };

    // ===== SHAPE LIST =====
    function updateShapeList() {
      document.getElementById('shape-count').textContent = shapes.length;
      const list = document.getElementById('shape-list');
      list.innerHTML = '';
      shapes.forEach(shape => {
        const item = document.createElement('div');
        item.className = 'shape-item' + (shape.id === selectedId ? ' selected' : '');
        const line = isLineShape(shape);
        const detail = line
          ? `${Math.round(Math.hypot((shape.points[1][0] - shape.points[0][0]) * MAP_WIDTH_PX, (shape.points[1][1] - shape.points[0][1]) * MAP_HEIGHT_PX))}m long, ${shape.widthM}m wide`
          : `${shape.width}×${shape.depth}×${shape.height}m`;
        item.innerHTML = `
          <div class="shape-color" style="background: ${shape.color}"></div>
          <div class="shape-info">
            <div class="shape-name">${shape.name}</div>
            <div class="shape-type">${detail}</div>
          </div>
          <div class="shape-actions">
            <button class="shape-action ${shape.locked ? 'locked' : ''}" data-action="lock">🔒</button>
            <button class="shape-action" data-action="fly">📍</button>
            <button class="shape-action" data-action="delete">🗑️</button>
          </div>
        `;
        item.onclick = (e) => {
          const action = e.target.closest('[data-action]')?.dataset.action;
          if (action === 'lock') {
            shapes = shapes.map(s => s.id === shape.id ? { ...s, locked: !s.locked } : s);
            saveToStorage();
            updateShapeList();
          } else if (action === 'fly') {
            const center = line
              ? [(shape.points[0][0] + shape.points[1][0]) / 2, (shape.points[0][1] + shape.points[1][1]) / 2]
              : [shape.x, shape.y];
            map.flyTo({ center, zoom: 15, pitch: 45, duration: 1000 });
          } else if (action === 'delete') {
            if (!shape.locked) {
              shapes = shapes.filter(s => s.id !== shape.id);
              if (selectedId === shape.id) selectedId = null;
              renderShapes();
              saveToStorage();
              updateShapeList();
            }
          } else {
            selectedId = shape.id;
            renderShapes();
            updateShapeList();
            updatePropertiesPanel();
            updateModeIndicator();
          }
        };
        list.appendChild(item);
      });
    }

    function updatePropertiesPanel() {
      const shape = shapes.find(s => s.id === selectedId);
      if (!shape) return;
      document.getElementById('prop-name').value = shape.name;
      const line = isLineShape(shape);
      document.getElementById('prop-width').value = line ? shape.widthM : shape.width;
      document.getElementById('prop-depth').value = line ? '' : shape.depth;
      document.getElementById('prop-height').value = line ? shape.heightM : shape.height;
      document.getElementById('prop-rotation').value = line ? '' : shape.rotation;
      document.getElementById('prop-depth').disabled = line;
      document.getElementById('prop-rotation').disabled = line;
    }

    function updateModeIndicator() {
      const indicator = document.getElementById('mode-indicator');
      if (isPlacingRoad) {
        indicator.textContent = roadStartPoint
          ? `Click the ${isPlacingRoad} end point`
          : `Click the ${isPlacingRoad} start point`;
        indicator.className = 'mode-indicator mode-place';
      } else if (isPlaceMode) {
        indicator.textContent = `Place: ${activeModel.name}`;
        indicator.className = 'mode-indicator mode-place';
      } else if (isDragging) {
        indicator.textContent = 'Move Object';
        indicator.className = 'mode-indicator mode-move';
      } else if (selectedId) {
        const shape = shapes.find(s => s.id === selectedId);
        indicator.textContent = shape && shape.locked ? `Selected: ${shape.name} (Locked)` : `Selected: ${shape?.name || 'Object'}`;
        indicator.className = 'mode-indicator mode-select';
      } else {
        indicator.textContent = 'Select Mode';
        indicator.className = 'mode-indicator mode-select';
      }
    }

    // ===== GIZMO (Roblox-style scale / rotate / height handles) =====
    // Only shown for box-shaped (building) shapes — roads/bridges are lines, not boxes.
    const gizmoEl = document.getElementById('gizmo');
    const ROTATE_OFFSET = 56;
    const HEIGHT_OFFSET = 46;

    function place(el, worldPoint, centerPx, extraPx) {
      const px = map.project(worldPoint);
      let x = px.x, y = px.y;
      if (extraPx) {
        const dx = px.x - centerPx.x, dy = px.y - centerPx.y;
        const len = Math.hypot(dx, dy) || 1;
        x += (dx / len) * extraPx;
        y += (dy / len) * extraPx;
      }
      el.style.transform = `translate(${x}px, ${y}px)`;
    }

    function updateGizmo() {
      const shape = shapes.find(s => s.id === selectedId);
      const isBox = shape && shape.type !== 'road' && shape.type !== 'bridge';
      if (!isBox || shape.locked || isPlaceMode || isPlacingRoad) {
        gizmoEl.style.display = 'none';
        return;
      }
      gizmoEl.style.display = 'block';

      const center = [shape.x, shape.y];
      const centerPx = map.project(center);
      const hw = shape.width / 2, hd = shape.depth / 2;

      place(document.getElementById('h-resize-right'), boxPoint(center, shape.rotation, hw, 0), centerPx);
      place(document.getElementById('h-resize-left'), boxPoint(center, shape.rotation, -hw, 0), centerPx);
      place(document.getElementById('h-resize-top'), boxPoint(center, shape.rotation, 0, hd), centerPx);
      place(document.getElementById('h-resize-bottom'), boxPoint(center, shape.rotation, 0, -hd), centerPx);

      place(document.getElementById('h-rotate'), boxPoint(center, shape.rotation, 0, hd), centerPx, ROTATE_OFFSET);

      const heightEl = document.getElementById('h-height');
      heightEl.style.transform = `translate(${centerPx.x}px, ${centerPx.y - HEIGHT_OFFSET}px)`;
    }

    function startHandleDrag(handleId, onMove) {
      document.getElementById(handleId).addEventListener('pointerdown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const shape = shapes.find(s => s.id === selectedId);
        if (!shape || shape.locked) return;
        const shapeStart = { ...shape };
        pushUndo();
        map.dragPan.disable();

        const move = (ev) => {
          const rect = map.getContainer().getBoundingClientRect();
          const point = map.unproject([ev.clientX - rect.left, ev.clientY - rect.top]);
          const patch = onMove([point.lng, point.lat], shapeStart);
          shapes = shapes.map(s => s.id === shapeStart.id ? { ...s, ...patch } : s);
          renderShapes();
        };
        const up = () => {
          map.dragPan.enable();
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          saveToStorage();
          updateShapeList();
          updatePropertiesPanel();
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      });
    }

    function computeResize(axis, sign, mouseWorld, s) {
      if (axis === 'x') {
        const fixed = boxPoint(s.center, s.rotation, -sign * (s.width / 2), 0);
        const [fdLng, fdLat] = [mouseWorld[0] - fixed[0], mouseWorld[1] - fixed[1]];
        const [flx] = toLocalDelta(fdLng, fdLat, s.rotation);
        const newWidth = Math.max(1, Math.round(sign * flx * MAP_WIDTH_PX));
        const newCenter = boxPoint(fixed, s.rotation, (sign * newWidth) / 2, 0);
        return { width: newWidth, x: newCenter[0], y: newCenter[1] };
      }
      const fixed = boxPoint(s.center, s.rotation, 0, -sign * (s.depth / 2));
      const [fdLng, fdLat] = [mouseWorld[0] - fixed[0], mouseWorld[1] - fixed[1]];
      const [, fly] = toLocalDelta(fdLng, fdLat, s.rotation);
      const newDepth = Math.max(1, Math.round(sign * fly * MAP_HEIGHT_PX));
      const newCenter = boxPoint(fixed, s.rotation, 0, (sign * newDepth) / 2);
      return { depth: newDepth, x: newCenter[0], y: newCenter[1] };
    }

    // shapeStart passed to handlers needs a `.center` alias for boxPoint() reuse
    function withCenter(s) { return { ...s, center: [s.x, s.y] }; }

    startHandleDrag('h-resize-right', (mw, s) => computeResize('x', 1, mw, withCenter(s)));
    startHandleDrag('h-resize-left', (mw, s) => computeResize('x', -1, mw, withCenter(s)));
    startHandleDrag('h-resize-top', (mw, s) => computeResize('y', 1, mw, withCenter(s)));
    startHandleDrag('h-resize-bottom', (mw, s) => computeResize('y', -1, mw, withCenter(s)));

    startHandleDrag('h-rotate', (mw, s) => {
      const [dLng, dLat] = [mw[0] - s.x, mw[1] - s.y];
      const angle = (Math.atan2(dLat, dLng) * 180) / Math.PI - 90;
      const normalized = ((angle % 360) + 360) % 360;
      return { rotation: Math.round(normalized) };
    });

    document.getElementById('h-height').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const shape = shapes.find(s => s.id === selectedId);
      if (!shape || shape.locked) return;
      const startY = e.clientY;
      const startHeight = shape.height;
      const id = shape.id;
      pushUndo();
      map.dragPan.disable();

      const move = (ev) => {
        const deltaPx = startY - ev.clientY;
        const newHeight = Math.max(1, Math.round(startHeight + deltaPx));
        shapes = shapes.map(s => s.id === id ? { ...s, height: newHeight } : s);
        renderShapes();
      };
      const up = () => {
        map.dragPan.enable();
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        saveToStorage();
        updateShapeList();
        updatePropertiesPanel();
      };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    });

    // ===== EXPORT =====
    document.getElementById('copy-btn').onclick = () => {
      const fc = { type: 'FeatureCollection', features: shapes.flatMap(shapeToFeatures) };
      navigator.clipboard.writeText(JSON.stringify(fc, null, 2));
      const btn = document.getElementById('copy-btn');
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy GeoJSON', 2000);
    };

    document.getElementById('download-btn').onclick = () => {
      const fc = { type: 'FeatureCollection', features: shapes.flatMap(shapeToFeatures) };
      const blob = new Blob([JSON.stringify(fc, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'leonida-studio.geojson'; a.click();
      URL.revokeObjectURL(url);
    };

    document.getElementById('clear-btn').onclick = () => {
      if (confirm('Delete all objects?')) {
        shapes = [];
        selectedId = null;
        renderShapes();
        saveToStorage();
        updateShapeList();
      }
    };

    // Init
    updateShapeList();
  </script>
</body>
</html>
